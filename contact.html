<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Koen Meershoek Fotografie</title>
  <meta name="description" content="Neem contact op met [Koen Meershoek] voor opdrachten of samenwerkingen." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAVIGATIE -->
  <nav>
    <a href="index.html" class="nav-logo">Koen Meershoek Fotografie</a>
    <ul class="nav-links">
      <li><a href="index.html">Werk</a></li>
      <li><a href="about.html">Over mij</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
      <li><a href="https://3mp.nl" class="nav-brand" target="_blank" rel="noopener"><img src="images/3mp-logo1.png" alt="3MP" /></a></li>
    </ul>
  </nav>

  <main>

    <div class="contact-grid">

      <!-- CONTACTGEGEVENS -->
      <div class="contact-info">

        <p class="contact-intro-label">Contact</p>
        <p class="contact-intro-name">Koen Meershoek Fotografie</p>

        <div class="contact-direct">
          <a href="mailto:koen@3mp.nl">koen@3mp.nl</a>
          <a href="tel:+31629626830">+31 6 29 62 68 30</a>
        </div>

        <div class="contact-social">
          <a href="https://instagram.com/Koens_Angle" target="_blank" rel="noopener" aria-label="Instagram">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
              <circle cx="12" cy="12" r="4"/>
              <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
            </svg>
          </a>
          <a href="https://www.linkedin.com/in/koen-meershoek-31ab37184/" target="_blank" rel="noopener" aria-label="LinkedIn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="2"/>
              <line x1="8" y1="11" x2="8" y2="17"/>
              <line x1="8" y1="7" x2="8" y2="8"/>
              <path d="M12 17v-4c0-1.1.9-2 2-2s2 .9 2 2v4"/>
              <line x1="12" y1="11" x2="12" y2="17"/>
            </svg>
          </a>
        </div>

      </div>

      <!-- CONTACTFORMULIER
           Dit formulier stuurt nu nog niks.
           Zie de README voor instructies om het werkend te maken via Netlify Forms.
      -->
      <form
        class="contact-form"
        name="contact"
        method="POST"
        data-netlify="true"
        netlify-honeypot="bot-field"
      >
        <!-- Verborgen veld voor Netlify spam-beveiliging -->
        <input type="hidden" name="form-name" value="contact" />
        <p style="display:none"><input name="bot-field" /></p>

        <div class="form-group">
          <label for="name">Naam</label>
          <input type="text" id="name" name="name" placeholder="Jan de Vries" required />
        </div>

        <div class="form-group">
          <label for="email">E-mailadres</label>
          <input type="email" id="email" name="email" placeholder="jan@voorbeeld.nl" required />
        </div>

        <div class="form-group">
          <label for="subject">Onderwerp</label>
          <input type="text" id="subject" name="subject" placeholder="Opdracht / Samenwerking / Vraag" />
        </div>

        <div class="form-group">
          <label for="message">Bericht</label>
          <textarea id="message" name="message" placeholder="Vertel me meer..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Versturen</button>

      </form>

    </div>

  </main>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 Koen Meershoek. Alle rechten voorbehouden.</p>
    <a href="contact.html">Contact opnemen</a>
  </footer>

</body>
</html>
