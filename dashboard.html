<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Bezoekersstatistieken - Koen Meershoek Fotografie</title>

  <style>
    .dash-title {
      font-family: 'Roboto', sans-serif !important;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      font-size: clamp(28px, 4vw, 44px) !important;
    }
    .dash-title .nav-logo-light { font-weight: 700; }
    .dash-title .nav-logo-bold { font-weight: 300; }
    .dash-wrap {
      padding: 0 48px 96px;
      max-width: 1100px;
    }
    .dash-cards {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 48px;
    }
    .dash-card {
      border: 1px solid var(--border);
      padding: 24px 28px;
      min-width: 160px;
    }
    .dash-card .num {
      font-family: 'Roboto', sans-serif;
      font-weight: 300;
      font-size: 36px;
      line-height: 1;
      color: var(--text);
    }
    .dash-card .label {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 8px;
    }
    .dash-chart {
      border: 1px solid var(--border);
      padding: 24px;
      overflow-x: auto;
    }
    .dash-chart-label {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .dash-bars {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 180px;
      min-width: 600px;
    }
    .dash-bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
    }
    .dash-bar {
      width: 100%;
      background: var(--text);
      opacity: 0.85;
      transition: opacity 0.2s ease;
    }
    .dash-bar-col:hover .dash-bar {
      opacity: 1;
    }
    .dash-bar-date {
      font-size: 9px;
      color: var(--text-muted);
      margin-top: 6px;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      white-space: nowrap;
    }
    .dash-status {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.75;
    }
    .dash-login {
      max-width: 360px;
      padding: 32px 0 8px;
    }
    .dash-login-row {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }
    .dash-login-row input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 12px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 300;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s ease;
    }
    .dash-login-row input:focus {
      border-color: var(--text);
    }
    .dash-login #dash-login-error {
      margin-top: 12px;
      min-height: 1em;
    }
    .dash-pages {
      border: 1px solid var(--border);
      padding: 24px;
      margin-top: 24px;
    }
    .dash-page-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .dash-page-row:last-child {
      border-bottom: none;
    }
    .dash-page-name {
      flex: 0 0 260px;
      font-size: 13px;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dash-page-bar-wrap {
      flex: 1;
      background: var(--hover);
      height: 10px;
    }
    .dash-page-bar {
      background: var(--text);
      height: 100%;
      opacity: 0.85;
    }
    .dash-page-count {
      flex: 0 0 44px;
      text-align: right;
      font-size: 13px;
      color: var(--text-muted);
    }

    @media (max-width: 900px) {
      .dash-wrap { padding: 0 24px 72px; }
    }
  </style>
</head>

  <script src="analytics-config.js"></script>
  <script>
    // Friendly labels for each tracked path, so the ranking reads like
    // project names instead of raw URLs.
    var PAGE_LABELS = {
      '/': 'Home',
      '/index.html': 'Home',
      '/en/': 'Home (EN)',
      '/en/index.html': 'Home (EN)',
      '/about.html': 'Over mij',
      '/en/about.html': 'About (EN)',
      '/contact.html': 'Contact',
      '/en/contact.html': 'Contact (EN)',
      '/publicaties.html': 'Publicaties',
      '/en/publicaties.html': 'Publications (EN)',
      '/bedankt.html': 'Bedankt',
      '/en/bedankt.html': 'Thank you (EN)',
      '/camdentown.html': 'Vakwerk Architecten - Camden Town',
      '/en/camdentown.html': 'Camden Town (EN)',
      '/nsstationsmetra.html': 'NS Stations - Metra',
      '/en/nsstationsmetra.html': 'NS Stations - Metra (EN)',
      '/linkwooddeark.html': 'Linkwood - The Ark',
      '/en/linkwooddeark.html': 'The Ark (EN)',
      '/houtbouwvalckensteyn.html': 'Linkwood - Houtbouw Valckensteyn',
      '/en/houtbouwvalckensteyn.html': 'Houtbouw Valckensteyn (EN)',
      '/krimpenerwaard.html': 'EHA - Gemeentehuis Krimpenerwaard',
      '/en/krimpenerwaard.html': 'Krimpenerwaard (EN)',
      '/valckensteyn.html': 'Linkwood - Valckensteyn',
      '/en/valckensteyn.html': 'Valckensteyn (EN)',
      '/bleiswijk.html': 'ArchitectuurMAKEN - Kindcentrum Bleiswijk',
      '/en/bleiswijk.html': 'Bleiswijk (EN)',
      '/linkwood.html': 'Linkwood - De Groene Redoute',
      '/en/linkwood.html': 'De Groene Redoute (EN)',
      '/dashboard.html': 'Dashboard',
    };

    function pageLabel(path) {
      return PAGE_LABELS[path] || path;
    }

    var cardsEl = document.getElementById('dash-cards');
    var barsEl = document.getElementById('dash-bars');
    var pagesEl = document.getElementById('dash-pages-list');
    var loginForm = document.getElementById('dash-login');
    var loginError = document.getElementById('dash-login-error');
    var contentEl = document.getElementById('dash-content');
    var SESSION_KEY = 'dashboardKey';

    async function loadDashboard(password) {
      if (!window.ANALYTICS_WORKER_URL || window.ANALYTICS_WORKER_URL.indexOf('REPLACE-ME') !== -1) {
        loginError.textContent = 'Nog niet ingesteld: vul de Worker-URL in analytics-config.js in.';
        return;
      }

      var headers = { 'X-Dashboard-Key': password };

      var res;
      try {
        res = await fetch(window.ANALYTICS_WORKER_URL + '/stats', { headers: headers });
      } catch (e) {
        loginError.textContent = 'Kon geen verbinding maken. Is de Worker live?';
        return;
      }

      if (res.status === 401) {
        try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
        loginError.textContent = 'Onjuist wachtwoord.';
        return;
      }

      // Password accepted: remember it for the rest of this browser tab
      // session (cleared automatically when the tab closes) and reveal
      // the real dashboard.
      try { sessionStorage.setItem(SESSION_KEY, password); } catch (e) {}
      loginForm.hidden = true;
      contentEl.hidden = false;

      try {
        var days = await res.json();
        var today = days[days.length - 1];
        var yesterday = days[days.length - 2] || { uniqueVisitors: 0, pageviews: 0 };

        cardsEl.innerHTML =
          '<div class="dash-card"><div class="num">' + today.uniqueVisitors + '</div><div class="label">Unieke bezoekers vandaag</div></div>' +
          '<div class="dash-card"><div class="num">' + today.pageviews + '</div><div class="label">Paginaweergaven vandaag</div></div>' +
          '<div class="dash-card"><div class="num">' + yesterday.uniqueVisitors + '</div><div class="label">Unieke bezoekers gisteren</div></div>';

        var max = Math.max.apply(null, days.map(function (d) { return d.uniqueVisitors; }).concat([1]));

        barsEl.innerHTML = days.map(function (d) {
          var heightPct = Math.round((d.uniqueVisitors / max) * 100);
          var shortDate = d.date.slice(5); // MM-DD
          return '<div class="dash-bar-col" title="' + d.date + ': ' + d.uniqueVisitors + ' unieke bezoekers">' +
            '<div class="dash-bar" style="height:' + Math.max(heightPct, 2) + '%"></div>' +
            '<div class="dash-bar-date">' + shortDate + '</div>' +
            '</div>';
        }).join('');
      } catch (e) {
        cardsEl.innerHTML = '<p class="dash-status">Kon de statistieken niet ophalen.</p>';
      }

      try {
        var pagesRes = await fetch(window.ANALYTICS_WORKER_URL + '/pages', { headers: headers });
        var pages = await pagesRes.json();

        if (!pages.length) {
          pagesEl.innerHTML = '<p class="dash-status">Nog geen pagina-bezoeken geregistreerd.</p>';
          return;
        }

        var pagesMax = pages[0].pageviews;

        pagesEl.innerHTML = pages.map(function (p) {
          var widthPct = Math.round((p.pageviews / pagesMax) * 100);
          return '<div class="dash-page-row">' +
            '<div class="dash-page-name" title="' + p.path + '">' + pageLabel(p.path) + '</div>' +
            '<div class="dash-page-bar-wrap"><div class="dash-page-bar" style="width:' + Math.max(widthPct, 2) + '%"></div></div>' +
            '<div class="dash-page-count">' + p.pageviews + '</div>' +
            '</div>';
        }).join('');
      } catch (e) {
        pagesEl.innerHTML = '<p class="dash-status">Kon de populairste projecten niet ophalen.</p>';
      }
    }

    loginForm.addEventListener('submit', function (e) {
      e.preventDefault();
      loginError.textContent = '';
      loadDashboard(document.getElementById('dash-password').value);
    });

    // Already unlocked earlier in this tab? Skip straight to the data.
    (function () {
      var saved;
      try { saved = sessionStorage.getItem(SESSION_KEY); } catch (e) {}
      if (saved) loadDashboard(saved);
    })();
  </script>
  <script src="script.js"></script>
</body>
