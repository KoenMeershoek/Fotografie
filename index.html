<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koen Meershoek Fotografie</title>
  <meta name="description" content="Portfolio van Koen Meershoek, fotograaf gespecialiseerd in film fotografie." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAVIGATIE -->
  <nav>
    <a href="index.html" class="nav-logo">Koen Meershoek Fotografie</a>
    <ul class="nav-links">
      <li><a href="index.html" class="active">Portfolio</a></li>
      <li><a href="about.html">Over mij</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="https://3mp.nl" class="nav-brand" target="_blank" rel="noopener"><img src="images/3mp-logo.png" alt="3MP" /></a></li>
    </ul>
  </nav>

  <main>

    <!-- HERO TEKST -->
    <section class="hero">
      <p class="hero-label">Fotografie portfolio</p>
      <h1>Beelden die<br><em>blijven hangen</em></h1>
      <p>Een selectie van werk dat ik met zorg heb gemaakt. Van architectuur tot portret, elk beeld vertelt een verhaal.</p>
    </section>

    <!-- FOTO GRID -->
    <section class="grid-section">

      <!-- FILTER KNOPPEN (optioneel) -->
      <div class="grid-filter">
        <button class="filter-btn active">Alles</button>
        <button class="filter-btn">Architectuur</button>
        <button class="filter-btn">Portret</button>
        <button class="filter-btn">Landschap</button>
      </div>

      <!-- FOTO GRID
           Vervang de src-waarden door je eigen foto's.
           Zet je foto's in een map genaamd 'fotos' naast dit bestand.
           Voorbeeld: src="fotos/project-01.jpg"
      -->
      <div class="photo-grid">

        <div class="photo-item">
          <img src="images/foto-01.jpg" alt="Foto" loading="lazy" />
          <div class="photo-overlay">
            <span class="photo-caption"></span>
          </div>
        </div>

        <div class="photo-item">
          <img src="images/Koen%20Koen%20Meershoek_3MP_Linkwood_DeGroeneRedoute_DRONE_2500px-4.jpg" alt="Drone fotografie" loading="lazy" />
          <div class="photo-overlay">
            <span class="photo-caption"></span>
          </div>
        </div>

        <div class="photo-item">
          <img src="images/Koen%20Meershoek_3MP_EHA%20krimpenerwaard_drone_2000px-2.jpg" alt="Drone Krimpenerwaard" loading="lazy" />
          <div class="photo-overlay">
            <span class="photo-caption"></span>
          </div>
        </div>

        <div class="photo-item">
          <img src="images/Koen%20Meershoek_3MP_EHA%20krimpenerwaard_2000px-30.jpg" alt="Krimpenerwaard" loading="lazy" />
          <div class="photo-overlay">
            <span class="photo-caption"></span>
          </div>
        </div>

        <div class="photo-item">
          <img src="images/Koen%20Meershoek_3MP_EHA%20krimpenerwaard_2000px-26%20.jpg" alt="Krimpenerwaard" loading="lazy" />
          <div class="photo-overlay">
            <span class="photo-caption"></span>
          </div>
        </div>

      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 Koen Meershoek. Alle rechten voorbehouden.</p>
    <a href="contact.html">Contact opnemen</a>
  </footer>

</body>
</html>
