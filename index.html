<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Koen Meershoek Fotografie</title>
  <meta name="description" content="Portfolio van Koen Meershoek, fotograaf gespecialiseerd in film fotografie." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAVIGATIE -->
  <nav>
    <a href="index.html" class="nav-logo">Koen Meershoek Fotografie</a>
    <ul class="nav-links">
      <li><a href="index.html" class="active">Werk</a></li>
      <li><a href="about.html">Over mij</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="https://3mp.nl" class="nav-brand" target="_blank" rel="noopener"><img src="images/3mp-logo1.png" alt="3MP" /></a></li>
    </ul>
  </nav>

  <main>

    <!-- FOTO GRID -->
    <section class="grid-section">

      <!-- FOTO GRID
           Vervang de src-waarden door je eigen foto's.
           Zet je foto's in een map genaamd 'fotos' naast dit bestand.
           Voorbeeld: src="fotos/project-01.jpg"
      -->
      <div class="photo-grid">

        <a href="linkwood.html" class="photo-item">
          <img src="images/foto-01.jpg" alt="Linkwood - De Groene Redoute" loading="lazy" />
          <div class="photo-overlay">
            <span class="photo-caption">Linkwood - De Groene Redoute</span>
          </div>
        </a>

        <a href="krimpenerwaard.html" class="photo-item">
          <img src="images/Koen%20Meershoek_3MP_EHA%20krimpenerwaard_drone_2000px-2.jpg" alt="EHA - Gemeentehuis Krimpenerwaard" loading="lazy" />
          <div class="photo-overlay">
            <span class="photo-caption">EHA - Gemeentehuis Krimpenerwaard</span>
          </div>
        </a>

        <a href="bleiswijk.html" class="photo-item">
          <img src="images/Koen%20Meershoek_3MP_ArchitectuurMAKEN-Kindcentrum%20Bleiswijk-2000px-32.jpg" alt="ArchitectuurMAKEN - Kindcentrum Bleiswijk" loading="lazy" />
          <div class="photo-overlay">
            <span class="photo-caption">ArchitectuurMAKEN - Kindcentrum Bleiswijk</span>
          </div>
        </a>

      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 Koen Meershoek. Alle rechten voorbehouden.</p>
    <a href="contact.html">Contact opnemen</a>
  </footer>

  <script>
    window.addEventListener('scroll', () => {
      const nav = document.querySelector('nav');
      nav.classList.toggle('scrolled', window.scrollY > 100);
    });
  </script>

</body>
</html>
